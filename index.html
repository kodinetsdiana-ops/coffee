<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="hero">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg" aria-hidden="true">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero__shade"></div>

    <div class="hero__title">
      <h1>First Coffee</h1>
      <p>Then Everything Else</p>
    </div>

    <p class="hero__lead">Freshly Brewed Coffee That Catches Everyone’s Attention.</p>

    <a class="cta" href="#catalog">
      <span class="cta__label">Choose Yours</span>
      <span class="cta__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M8 6h10v10"/></svg>
      </span>
    </a>

    <article class="card">
      <img class="card__img" src="assets/golden-crema.jpg" alt="Golden Crema coffee bag">
      <div class="card__body">
        <h2>Golden Crema</h2>
        <a class="card__btn" href="#golden-crema">
          See More
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M8 6h10v10"/></svg>
        </a>
      </div>
    </article>
  </section>
</body>
</html>
